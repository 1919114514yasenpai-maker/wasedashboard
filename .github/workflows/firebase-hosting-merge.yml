name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create Firebase Config if missing
        run: |
          if [ ! -f firebase-applet-config.json ]; then
            cp firebase-applet-config.example.json firebase-applet-config.json
          fi

      - name: Build application
        run: npm run build

      - name: Deploy to Firebase Hosting Live Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WASEDASHBOARD }}'
          channelId: live
          projectId: wasedashboard
