name: Deploy to Firebase Hosting on PR

on:
  pull_request:

jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create Firebase Config if missing
        run: |
          if [ ! -f firebase-applet-config.json ]; then
            cp firebase-applet-config.example.json firebase-applet-config.json
          fi

      - name: Build application
        run: npm run build

      - name: Validate Firebase Secret
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_WASEDASHBOARD }}" ]; then
            echo "::error::GitHub Secret 'FIREBASE_SERVICE_ACCOUNT_WASEDASHBOARD' is missing in Repository Settings > Secrets and variables > Actions."
            echo "Please add your Firebase Service Account JSON key to GitHub Secrets as FIREBASE_SERVICE_ACCOUNT_WASEDASHBOARD."
            exit 1
          fi

      - name: Deploy Preview Channel to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WASEDASHBOARD }}'
          projectId: wasedashboard

