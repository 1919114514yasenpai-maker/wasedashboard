name: Deploy to Firebase Hosting on PR

on:
  pull_request:

jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create Firebase Config if missing
        run: |
          if [ ! -f firebase-applet-config.json ]; then
            cp firebase-applet-config.example.json firebase-applet-config.json
          fi

      - name: Build application
        run: npm run build

      - name: Deploy to Firebase Hosting
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT_WASEDASHBOARD }}" ]; then
            echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WASEDASHBOARD }}' > sa_key.json
            export GOOGLE_APPLICATION_CREDENTIALS=sa_key.json
          fi
          npx firebase-tools deploy --only hosting --project waseapp-works-waseworkapp --non-interactive
          rm -f sa_key.json
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

